<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background:#07080a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Display', monospace;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="50%" stop-color="#07080a"/>
      <stop offset="100%" stop-color="#040507"/>
    </linearGradient>

    <linearGradient id="panel-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151821" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d0f14" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffbe00"/>
      <stop offset="100%" stop-color="#ff9100"/>
    </linearGradient>

    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0099ff"/>
    </linearGradient>

    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00cc66"/>
    </linearGradient>

    <linearGradient id="pink-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#d6006b"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="panel-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1c202a" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="760" fill="url(#bg-grad)"/>
  <rect width="1200" height="760" fill="url(#grid)" opacity="0.6"/>

  <!-- Top Title Banner -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="1080" height="60" rx="8" fill="#10131a" stroke="#222836" stroke-width="1.5"/>
    <circle cx="25" cy="30" r="6" fill="#ffbe00" filter="url(#glow-amber)"/>
    <text x="45" y="36" fill="#ffffff" font-size="18" font-weight="700" letter-spacing="1.5">ABLETON LIVE 12 MCP — 3-LAYER FULL-COVERAGE ARCHITECTURE</text>
    <rect x="840" y="18" width="110" height="24" rx="12" fill="#ffbe00" fill-opacity="0.15" stroke="#ffbe00" stroke-width="1"/>
    <text x="895" y="34" fill="#ffbe00" font-size="11" font-weight="700" text-anchor="middle">PURE PYTHON</text>
    <rect x="960" y="18" width="100" height="24" rx="12" fill="#00d2ff" fill-opacity="0.15" stroke="#00d2ff" stroke-width="1"/>
    <text x="1010" y="34" fill="#00d2ff" font-size="11" font-weight="700" text-anchor="middle">70+ TOOLS</text>
  </g>

  <!-- LAYER 1: CLIENT LAYER (Top) -->
  <g transform="translate(60, 125)">
    <rect width="1080" height="135" rx="12" fill="url(#panel-grad)" stroke="#ffbe00" stroke-width="1.5" stroke-opacity="0.4" filter="url(#panel-shadow)"/>
    <!-- Header -->
    <path d="M 0 12 C 0 5.373 5.373 0 12 0 L 1068 0 C 1074.627 0 1080 5.373 1080 12 L 1080 34 L 0 34 Z" fill="#191d26"/>
    <text x="20" y="22" fill="#ffbe00" font-size="12" font-weight="800" letter-spacing="1">TIER 1: AUTONOMOUS CLIENT &amp; AGENT INTERFACE</text>
    <text x="1060" y="22" fill="#8e99a8" font-size="11" text-anchor="end">Execution Context: User Terminal / agy</text>

    <!-- Sub components -->
    <g transform="translate(25, 48)">
      <!-- Box 1 -->
      <rect x="0" y="0" width="310" height="68" rx="8" fill="#0e1017" stroke="#252a38" stroke-width="1"/>
      <text x="16" y="26" fill="#ffffff" font-size="14" font-weight="700">Antigravity CLI (agy)</text>
      <text x="16" y="46" fill="#7a8494" font-size="11">Autonomous Model Execution Engine</text>
      <circle cx="285" cy="24" r="4" fill="#ffbe00"/>
    </g>

    <g transform="translate(385, 48)">
      <!-- Box 2 -->
      <rect x="0" y="0" width="310" height="68" rx="8" fill="#0e1017" stroke="#252a38" stroke-width="1"/>
      <text x="16" y="26" fill="#ffffff" font-size="14" font-weight="700">LLM Swarm / Multi-Agent</text>
      <text x="16" y="46" fill="#7a8494" font-size="11">Gemini 4 Argon / 3.8 Flash Swarms</text>
      <circle cx="285" cy="24" r="4" fill="#00d2ff"/>
    </g>

    <g transform="translate(745, 48)">
      <!-- Box 3 -->
      <rect x="0" y="0" width="310" height="68" rx="8" fill="#0e1017" stroke="#252a38" stroke-width="1"/>
      <text x="16" y="26" fill="#ffffff" font-size="14" font-weight="700">JSON-RPC 2.0 stdio</text>
      <text x="16" y="46" fill="#7a8494" font-size="11">Newline-delimited framing over stdin/stdout</text>
      <circle cx="285" cy="24" r="4" fill="#00ff88"/>
    </g>
  </g>

  <!-- ARROW 1 -> 2 -->
  <g transform="translate(600, 260)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#00d2ff" stroke-width="2.5" stroke-dasharray="5 4"/>
    <polygon points="-6,35 6,35 0,44" fill="#00d2ff"/>
    <rect x="-110" y="10" width="220" height="20" rx="10" fill="#090b0f" stroke="#00d2ff" stroke-width="1"/>
    <text x="0" y="24" fill="#00d2ff" font-size="10" font-weight="700" text-anchor="middle">MCP stdio PROTOCOL (2024-11-05)</text>
  </g>

  <!-- LAYER 2: HOST MCP SERVER & OS BRIDGE (Middle) -->
  <g transform="translate(60, 305)">
    <rect width="1080" height="175" rx="12" fill="url(#panel-grad)" stroke="#00d2ff" stroke-width="1.5" stroke-opacity="0.4" filter="url(#panel-shadow)"/>
    <path d="M 0 12 C 0 5.373 5.373 0 12 0 L 1068 0 C 1074.627 0 1080 5.373 1080 12 L 1080 34 L 0 34 Z" fill="#141a24"/>
    <text x="20" y="22" fill="#00d2ff" font-size="12" font-weight="800" letter-spacing="1">TIER 2: ABLETON LIVE 12 MCP SERVER &amp; OS BRIDGE</text>
    <text x="1060" y="22" fill="#8e99a8" font-size="11" text-anchor="end">Pure Python stdlib (src/ableton_live12_mcp)</text>

    <!-- 4 Sub Columns -->
    <g transform="translate(20, 46)">
      <!-- Col 1 -->
      <rect x="0" y="0" width="245" height="112" rx="8" fill="#0c0e14" stroke="#1f2533" stroke-width="1"/>
      <text x="14" y="24" fill="#ffffff" font-size="13" font-weight="700">McpServer Engine</text>
      <text x="14" y="44" fill="#7a8494" font-size="10">• tools/list &amp; tools/call</text>
      <text x="14" y="62" fill="#7a8494" font-size="10">• Draft-07 JSON Schema</text>
      <text x="14" y="80" fill="#7a8494" font-size="10">• MockAbletonBridge fallback</text>
      <text x="14" y="98" fill="#7a8494" font-size="10">• Clean stderr diagnostics</text>
    </g>

    <g transform="translate(285, 46)">
      <!-- Col 2 -->
      <rect x="0" y="0" width="245" height="112" rx="8" fill="#0c0e14" stroke="#1f2533" stroke-width="1"/>
      <text x="14" y="24" fill="#ffffff" font-size="13" font-weight="700">70+ Tool Catalog</text>
      <text x="14" y="44" fill="#7a8494" font-size="10">• Transport, Song &amp; Tuning</text>
      <text x="14" y="62" fill="#7a8494" font-size="10">• Tracks, TakeLanes, Comping</text>
      <text x="14" y="80" fill="#7a8494" font-size="10">• Extended MIDI &amp; Warping</text>
      <text x="14" y="98" fill="#7a8494" font-size="10">• Devices: Meld, Roar, Drift, Racks</text>
    </g>

    <g transform="translate(550, 46)">
      <!-- Col 3 -->
      <rect x="0" y="0" width="245" height="112" rx="8" fill="#0c0e14" stroke="#1f2533" stroke-width="1"/>
      <text x="14" y="24" fill="#ffffff" font-size="13" font-weight="700">Hybrid Dialog &amp; OS Bridge</text>
      <text x="14" y="44" fill="#7a8494" font-size="10">• LOM Application.View dialogs</text>
      <text x="14" y="62" fill="#7a8494" font-size="10">• AppleScript System Events</text>
      <text x="14" y="80" fill="#7a8494" font-size="10">• Cocoa NSSavePanel automation</text>
      <text x="14" y="98" fill="#7a8494" font-size="10">• Save Set &amp; WAV Audio Export</text>
    </g>

    <g transform="translate(815, 46)">
      <!-- Col 4 -->
      <rect x="0" y="0" width="245" height="112" rx="8" fill="#0c0e14" stroke="#1f2533" stroke-width="1"/>
      <text x="14" y="24" fill="#ffffff" font-size="13" font-weight="700">Live12Client IPC</text>
      <text x="14" y="44" fill="#7a8494" font-size="10">• Discovery: /tmp/ableton_live12_bridge.json</text>
      <text x="14" y="62" fill="#7a8494" font-size="10">• Loopback TCP: 127.0.0.1:11246</text>
      <text x="14" y="80" fill="#7a8494" font-size="10">• NDJSON Line Framing</text>
      <text x="14" y="98" fill="#7a8494" font-size="10">• Auto-reconnect &amp; &lt;50ms latency</text>
    </g>
  </g>

  <!-- ARROW 2 -> 3 -->
  <g transform="translate(600, 480)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#00ff88" stroke-width="2.5" stroke-dasharray="5 4"/>
    <polygon points="-6,35 6,35 0,44" fill="#00ff88"/>
    <rect x="-140" y="10" width="280" height="20" rx="10" fill="#090b0f" stroke="#00ff88" stroke-width="1"/>
    <text x="0" y="24" fill="#00ff88" font-size="10" font-weight="700" text-anchor="middle">LOOPBACK TCP (127.0.0.1:11246) NDJSON RPC</text>
  </g>

  <!-- LAYER 3: IN-PROCESS CONTROL SURFACE & LIVE 12 SUITE (Bottom) -->
  <g transform="translate(60, 525)">
    <rect width="1080" height="185" rx="12" fill="url(#panel-grad)" stroke="#00ff88" stroke-width="1.5" stroke-opacity="0.4" filter="url(#panel-shadow)"/>
    <path d="M 0 12 C 0 5.373 5.373 0 12 0 L 1068 0 C 1074.627 0 1080 5.373 1080 12 L 1080 34 L 0 34 Z" fill="#121e1a"/>
    <text x="20" y="22" fill="#00ff88" font-size="12" font-weight="800" letter-spacing="1">TIER 3: IN-PROCESS CONTROL SURFACE BRIDGE &amp; ABLETON LIVE 12.4.6 SUITE</text>
    <text x="1060" y="22" fill="#8e99a8" font-size="11" text-anchor="end">Runtime: Embedded CPython 3.11.6 in Contents/MacOS/Live</text>

    <!-- 3 Large Sub Blocks -->
    <g transform="translate(25, 46)">
      <rect x="0" y="0" width="320" height="122" rx="8" fill="#09120e" stroke="#1b3326" stroke-width="1"/>
      <text x="16" y="24" fill="#00ff88" font-size="13" font-weight="700">Live12Bridge Remote Script</text>
      <text x="16" y="44" fill="#ffffff" font-size="11">User Library/Remote Scripts/Live12Bridge/</text>
      <text x="16" y="64" fill="#7a8494" font-size="10">• create_instance(c_instance) initialization</text>
      <text x="16" y="82" fill="#7a8494" font-size="10">• Live.Base.Timer (5ms main thread scheduler)</text>
      <text x="16" y="100" fill="#7a8494" font-size="10">• Zero GUI stall: queue-drained task runner</text>
    </g>

    <g transform="translate(380, 46)">
      <rect x="0" y="0" width="320" height="122" rx="8" fill="#09120e" stroke="#1b3326" stroke-width="1"/>
      <text x="16" y="24" fill="#00ff88" font-size="13" font-weight="700">Dynamic LOM Reflection Engine</text>
      <text x="16" y="44" fill="#ffffff" font-size="11">Universal LOM Dispatcher &amp; Serializer</text>
      <text x="16" y="64" fill="#7a8494" font-size="10">• Pointer Safety: liveobj_valid checks</text>
      <text x="16" y="82" fill="#7a8494" font-size="10">• lom_inspect, lom_get, lom_set, lom_call</text>
      <text x="16" y="100" fill="#7a8494" font-size="10">• Extended MIDI: MidiNoteSpecification support</text>
    </g>

    <g transform="translate(735, 46)">
      <rect x="0" y="0" width="320" height="122" rx="8" fill="#09120e" stroke="#1b3326" stroke-width="1"/>
      <text x="16" y="24" fill="#00ff88" font-size="13" font-weight="700">C++ Boost.Python Live.* API</text>
      <text x="16" y="44" fill="#ffffff" font-size="11">Ableton Live 12.4.6 Suite Engine</text>
      <text x="16" y="64" fill="#7a8494" font-size="10">• 49 LOM Classes &amp; 184 Boost.Python Types</text>
      <text x="16" y="82" fill="#7a8494" font-size="10">• Live.Song, Clip, Track, Device, TakeLane</text>
      <text x="16" y="100" fill="#7a8494" font-size="10">• Real-Time Audio Engine &amp; DSP Mixer</text>
    </g>
  </g>

  <!-- Bottom Metadata Footer -->
  <g transform="translate(60, 725)">
    <text x="0" y="15" fill="#4a5568" font-size="11">JUAN CRUZ MUÑOZ ALBELO • OPEN SOURCE • DUAL LICENSED (MIT / APACHE 2.0)</text>
    <text x="1080" y="15" fill="#4a5568" font-size="11" text-anchor="end">TARGET: ABLETON LIVE 12.4.6 SUITE (BUILD 2026-09-10_0DE5C8FA9A)</text>
  </g>
</svg>
